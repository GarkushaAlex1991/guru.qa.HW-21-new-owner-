plugins {
  id 'java'
  id 'io.qameta.allure' version '2.12.0'
}

group = 'ru.mail.flores01.lena'
version = '1.0-SNAPSHOT'

allure {
  report {
    version.set("2.29.0")
  }
  adapter {
    aspectjWeaver.set(true)
    frameworks {
      junit5 {
        adapterVersion.set("2.29.0")
      }
    }
  }
}

repositories {
  mavenCentral()
}

dependencies {
  testImplementation(
    'org.seleniumhq.selenium:selenium-java:3.141.59',
    'io.github.bonigarcia:webdrivermanager:6.3.4',
    'org.junit.jupiter:junit-jupiter:5.11.0',
    'com.codeborne:selenide:7.8.1',
    'org.aeonbits.owner:owner:1.0.4',
    'org.assertj:assertj-core:3.26.3',
    'org.slf4j:slf4j-log4j12:2.0.18',
    'org.slf4j:slf4j-api:2.0.17',
  )
  testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.8.1')
}

test {
  useJUnitPlatform()
  systemProperties(System.getProperties())
}

tasks.withType(JavaCompile) {
  options.encoding = 'UTF-8'
}

task smokeTest(type: Test) {
  useJUnitPlatform {
    includeTags("smoke")
  }
//  systemProperty 'remoteUrl', System.getProperty('remoteUrl')

  systemProperties(System.getProperties());

}